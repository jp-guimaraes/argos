name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  loop-device-tests:
    name: loop-device integration tests (root)
    # Backlog E9: exercises argos-helper against a real file-backed loop
    # device. Needs root (for losetup / /dev/loop-control) and the losetup
    # binary, which is why it's a separate job from the unprivileged `test`
    # job above -- GitHub-hosted Ubuntu runners have passwordless sudo and
    # losetup preinstalled, but this would fail on a minimal/locked-down
    # self-hosted runner, so it's kept isolated and easy to disable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo -E env "PATH=$PATH" cargo test -p argos-privileged \
            --features test-overrides --test loop_device_write \
            -- --ignored --nocapture

  windows-write-tests:
    name: Windows installer write integration tests (root)
    # Phase 3 M3.6 (#43): exercises the real FAT32 Windows write path
    # against a real file-backed loop device -- the Windows-write
    # counterpart to loop-device-tests above. Needs the same root/losetup
    # prerequisites, and nothing else: no mkfs, no mount, no --partscan. An
    # earlier two-partition UEFI:NTFS path (backlog #27) needed
    # mkfs.ntfs/ntfs-3g here; it was retired at decision point M4.3 once
    # this layout was validated on real hardware from both hosts, on both
    # firmwares (see docs/architecture.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo -E env "PATH=$PATH" cargo test -p argos-privileged \
            --features test-overrides --test write_windows_fat32 \
            -- --ignored --nocapture --test-threads=1
      # #56: confronts the FAT32 we write with implementations that have no
      # stake in ours -- dosfstools' fsck.vfat for structure, the kernel's
      # own vfat driver for content. This is the pairing that would have
      # caught the directory defects Windows rejected: our write and verify
      # both read through the same fatfs, so they agreed with each other
      # while the medium was malformed. fsck.vfat needs no root (the
      # partition is extracted to a file); the mount does, which is why this
      # lives here rather than in the plain test job.
      - run: sudo apt-get install -y dosfstools
      - run: |
          sudo -E env "PATH=$PATH" cargo test -p argos-privileged \
            --features test-overrides --test fat32_conformance_linux \
            -- --ignored --nocapture --test-threads=1
      # Phase 3 L3 (docs/plan-linux-validation.md): the #59 stale-GPT fix as
      # the kernel sees it. windows_fat32's own unit test covers the bytes
      # over a plain file; this covers what a file cannot -- Linux caches
      # partition tables per block device, so the device is detached and
      # re-attached between writes and libblkid, which has no stake in our
      # writer, is asked what the medium carries. Attaches with --partscan,
      # unlike the step above, because the kernel parsing the table is the
      # point.
      - run: |
          sudo -E env "PATH=$PATH" cargo test -p argos-privileged \
            --features test-overrides --test recycled_device_gpt \
            -- --ignored --nocapture --test-threads=1

  wim-split-oracle-tests:
    name: WIM splitter validation against wimlib (oracle)
    # Phase 3 M2.4 (#42): cross-checks image::wim's .swm output against
    # wimlib, an independent implementation -- wimlib is run as a
    # subprocess only (it is GPL; never linked or vendored). Its own job
    # because it is the only one needing the wimtools package, and because
    # a failure here means the split format is wrong, which is a different
    # kind of problem from a device-I/O failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y wimtools
      - run: |
          cargo test -p argos-core --release --test wim_split_oracle \
            -- --ignored --nocapture --test-threads=1

  bios-boot-chain-tests:
    name: BIOS boot chain under QEMU (M6.5)
    # Phase 3 M6.5 (#45): boots Argos-written media under SeaBIOS and asserts
    # the MBR finds the active partition and hands off correctly. Boot records
    # are the highest-risk code here -- a wrong byte gives "no bootable
    # device" on hardware that cannot be single-stepped -- so they get an
    # emulator in CI rather than only a lab machine nobody can debug.
    # No root and no real hardware: qemu and nasm are ordinary packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 nasm
      # --test-threads=1: each case boots its own QEMU, and running them
      # concurrently makes the wall-clock timeouts unreliable.
      - run: |
          cargo test -p argos-privileged --test bios_boot_chain \
            -- --ignored --nocapture --test-threads=1

  dm-resolution-tests:
    name: device-mapper resolution integration tests (root)
    # Backlog E2: exercises the LVM/RAID/dm-crypt resolver against a real
    # dmsetup + loop-device stack. Same root/losetup prerequisites as
    # loop-device-tests above (plus dmsetup, preinstalled on GitHub-hosted
    # Ubuntu runners), kept as its own job to isolate failures by backlog
    # area rather than because it needs anything loop-device-tests doesn't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo -E env "PATH=$PATH" cargo test -p argos-platform-linux \
            --test dm_resolution -- --ignored --nocapture

  hdiutil-image-tests:
    name: hdiutil-image integration tests (macOS)
    # Backlog E9's macOS counterpart to loop-device-tests above: exercises
    # argos-helper against a real disk image attached via `hdiutil attach
    # -nomount`. Unlike losetup, attaching a raw disk image is a normal,
    # unprivileged macOS operation (DiskArbitration, not a root-only ioctl),
    # so this needs no sudo and no passwordless-sudo assumption -- it's still
    # a separate job (rather than folded into `test` above) only to keep
    # E9's Linux/macOS halves structurally parallel and independently
    # skippable, and because it still needs the `test-overrides` feature the
    # regular `test` job doesn't build with.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo test -p argos-privileged --features test-overrides \
            --test hdiutil_image_write -- --ignored --nocapture
      # Phase 3 M4.2 (#34): the FAT32 Windows write path on macOS. Needs no
      # macFUSE, no ntfs-3g and no root -- which was the whole point of the
      # layout change, and is why this can run in CI at all, unlike the
      # macFUSE route #34 originally planned.
      - run: |
          cargo test -p argos-privileged --features test-overrides \
            --test hdiutil_windows_fat32 --test automount_regression \
            -- --ignored --nocapture --test-threads=1

  deb-package:
    name: build and lint the .deb (Debian packaging, backlog #46)
    # Builds a real .deb with packaging/build-deb.sh on every push and PR,
    # then runs it through lintian -- Debian's own packaging linter -- the
    # same way the Homebrew tap's CI builds and tests the formula on a real
    # runner rather than trusting the config by inspection. Caught three
    # real defects during development this way: an unstripped binary (fixed
    # by [profile.release] strip = true), a copyright file that named
    # Apache-2.0 without including its text, and cargo-deb's Debian-archive
    # -only changelog expectation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deb --locked
      - run: packaging/build-deb.sh
      - run: sudo apt-get install -y lintian
      - name: lintian (errors fail the build; warnings are printed, not enforced)
        run: |
          set +e
          lintian target/debian/argos_*.deb
          status=$?
          set -e
          # lintian's exit code conflates errors and warnings; only E: lines
          # are build-breaking here. no-manual-page on argos-helper (it is
          # never meant to be run interactively) and
          # initial-upload-closes-no-bugs (only relevant to an actual
          # Debian-archive ITP submission) are known, accepted warnings.
          if lintian target/debian/argos_*.deb 2>&1 | grep -q '^E:'; then
            echo "lintian reported an error -- see above"
            exit 1
          fi
          exit 0
      - run: sudo apt-get install -y ./target/debian/argos_*.deb
      - run: argos --version
      - uses: actions/upload-artifact@v4
        with:
          name: argos-deb
          path: target/debian/argos_*.deb
          if-no-files-found: error
