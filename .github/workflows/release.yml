name: Release binaries

# Backlog E10 (#11): builds argos + argos-helper for every host this project
# supports and attaches them to a GitHub Release. Triggered by pushing a
# `vX.Y.Z` tag -- nothing here runs on an ordinary push or PR. Uses the
# GitHub CLI (already on every runner, authenticated via GITHUB_TOKEN)
# rather than a third-party release action, matching the project's general
# preference for one fewer thing to trust.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            # macos-latest runners are Apple Silicon; this target cross-
            # compiles cleanly on them with no extra toolchain setup (Xcode's
            # clang already supports both Apple Silicon and Intel Mach-O),
            # confirmed by actually building it this way during development.
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p argos-cli -p argos-privileged

      # Debian packaging (backlog #46): only makes sense for the glibc Linux
      # target, and packaging/build-deb.sh assumes an untargeted build
      # (`target/release/`, not `target/${{ matrix.target }}/release/`), so
      # it gets its own plain `cargo build` rather than reusing the one
      # above.
      - name: Build the .deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: argos-deb
          path: target/debian/argos_*.deb
          if-no-files-found: error

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          stage="argos-${TAG}-${TARGET}"
          mkdir "$stage"
          cp "target/${TARGET}/release/argos" "$stage/"
          cp "target/${TARGET}/release/argos-helper" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar czf "${stage}.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: argos-${{ matrix.target }}
          path: argos-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release and attach every target's tarball, plus the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.deb \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  update-homebrew-tap:
    name: bump the Homebrew tap
    # Reported from real use: the tap sat pinned to v1.5.1 through four
    # releases (1.5.2-1.5.5) because bumping it was a manual step nobody
    # remembered, and `brew install`/`brew upgrade` served the stale version
    # silently -- no error, just old bits. This closes that gap the same way
    # `release` above closes "the GitHub Release lagged the tag": make the
    # step automatic and part of what a tag push does, not a followup
    # someone has to recall.
    needs: release
    runs-on: ubuntu-latest
    steps:
      # A second checkout, of the *other* repo -- `HOMEBREW_TAP_TOKEN` is a
      # fine-grained PAT scoped to jp-guimaraes/homebrew-argos only, since
      # the default `GITHUB_TOKEN` above is scoped to this repo and cannot
      # push there. Missing/expired token: this step's checkout fails loudly
      # rather than silently skipping, which is the right failure mode for
      # "the tap didn't get bumped" to actually be noticed.
      - name: Checkout the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jp-guimaraes/homebrew-argos
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Point the formula at this tag
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          # The formula builds from this same source-archive URL (not the
          # release binaries above), so its sha256 has to match *that*
          # tarball exactly -- computed fresh here rather than reused from
          # anywhere, since GitHub's archive tarballs are not guaranteed
          # byte-identical to anything built earlier in this workflow.
          sha256=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          if [ -z "$sha256" ]; then
            echo "could not compute a sha256 for $url" >&2
            exit 1
          fi
          sed -i "s#archive/refs/tags/v[0-9.]*\.tar\.gz#archive/refs/tags/${TAG}.tar.gz#" Formula/argos.rb
          sed -i "s/sha256 \"[0-9a-f]*\"/sha256 \"${sha256}\"/" Formula/argos.rb

      - name: Commit and push, if the formula actually changed
        run: |
          git config user.name "argos-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/argos.rb
          git diff --cached --quiet && { echo "formula already up to date"; exit 0; }
          git commit -m "Bump to ${{ github.ref_name }}"
          git push
