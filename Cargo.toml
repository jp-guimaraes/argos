[workspace]
resolver = "2"
members = [
    "crates/argos-core",
    "crates/argos-platform",
    "crates/argos-platform-linux",
    "crates/argos-platform-macos",
    "crates/argos-platform-windows",
    "crates/argos-privileged",
    "crates/argos-cli",
    "xtask",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
# 1.75 until W1's UDF-support correction (backlog #27): real Windows install
# media turned out to need UDF reading (hadris-udf, MSRV 1.88), not just
# ISO9660, so this moved with it.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jp-guimaraes/argos"
authors = ["Argos contributors"]

[workspace.dependencies]
# argos-cli only (backlog #35, write cancellation) -- CONTRIBUTING.md's
# "keep it minimal" rule targets argos-privileged specifically, not this
# crate. A small, single-purpose, widely-used Rust CLI standard for catching
# SIGINT portably.
ctrlc = "3"
# `version` is required here (not just `path`) for every crate this workspace
# publishes to crates.io -- a published crate can't depend on a bare local
# path, since that path won't exist on whoever installs it; cargo strips
# `path` at publish time and resolves the dependency from the registry using
# `version` instead. argos-platform-windows is intentionally left without one
# below: it's a stub nothing published here depends on, so it stays
# unpublished for now.
argos-core = { path = "crates/argos-core", version = "1.5.0" }
argos-platform = { path = "crates/argos-platform", version = "1.5.0" }
argos-platform-linux = { path = "crates/argos-platform-linux", version = "1.5.0" }
argos-platform-macos = { path = "crates/argos-platform-macos", version = "1.5.0" }
argos-platform-windows = { path = "crates/argos-platform-windows" }
argos-privileged = { path = "crates/argos-privileged", version = "1.5.0" }

thiserror = "2"
sha2 = "0.10"
# Pinned to the 1.x line: implemented and tested against it before this
# workspace's rust-version bump (see above) removed the original reason for
# avoiding 2.x/3.x (their MSRV, 1.85, no longer being out of reach). Revisiting
# to the latest line is unrelated cleanup, not something W3 needed.
gptman = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

[profile.release]
lto = true
codegen-units = 1
