<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A USB stick, deliberately: it's the one object this app actually
       writes to, and the palette matches theme.rs's LIGHT.accent (#2B6E62)
       so the icon reads as part of the same design rather than a separate
       one bolted on. No mascot here: draw_header's reserved 168x42 sprite
       needs an illustrator's frames, which this is not standing in for. -->
  <rect x="22" y="6" width="20" height="14" rx="2" fill="#1E1D1B"/>
  <rect x="27" y="2" width="4" height="7" fill="#94908A"/>
  <rect x="33" y="2" width="4" height="7" fill="#94908A"/>
  <rect x="14" y="18" width="36" height="40" rx="6" fill="#2B6E62"/>
  <rect x="20" y="26" width="24" height="4" rx="2" fill="#FBFAF8"/>
  <rect x="20" y="34" width="24" height="4" rx="2" fill="#FBFAF8"/>
  <rect x="20" y="42" width="14" height="4" rx="2" fill="#FBFAF8"/>
</svg>
