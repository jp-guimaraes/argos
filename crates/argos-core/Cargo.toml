[package]
name = "argos-core"
description = "Platform-agnostic domain logic for Argos: device model, ISO classification, checksums, write engine, progress/cancellation. No direct OS disk I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
# `newtua-cdfs` under the local name `cdfs`: same ISO9660/ECMA-119 reading API
# as the canonical `cdfs` crate, but without its hard dependency on `fuser`
# (FUSE bindings) and a `clap`-based mount binary that argos-core never uses.
# See docs/architecture.md's phase-2 guiding decisions for why the fork was
# chosen over the canonical crate.
cdfs = { package = "newtua-cdfs", version = "0.2.4-newtua.1" }
# Runtime UDF reading is `image::udf`, Argos's own streaming module (phase 3
# M1, backlog #40): `hadris-udf` had no streaming read API, its extent
# resolution is private, and a real `install.wim`'s whole-file-in-memory read
# OOM-killed a real machine (#38). The crate remains only as the *fixture
# generator* for tests -- an independent UDF implementation whose output
# `image::udf` is verified against -- so it's optional here (pulled in by
# `test-fixtures`) and a dev-dependency below, never a production dependency.
hadris-udf = { version = "2.2.0", features = ["write"], optional = true }

[features]
# Exposes image::windows::fixtures outside this crate's own tests, so
# argos-privileged's root-gated Windows-write integration tests (backlog
# #27, W3) can build a real Windows-installer-shaped ISO without
# duplicating that hand-rolled ISO9660/UDF builders. Never enabled in a
# production build -- only ever turned on as a dev-dependency feature.
#
# Pulls in the optional hadris-udf dependency (with its `write` feature, set
# on the optional dependency itself above): when a downstream crate
# (argos-privileged) depends on this crate normally (not via
# [dev-dependencies]) with test-fixtures on, this crate's own
# [dev-dependencies] section -- which enables hadris-udf for this crate's own
# `cargo test` -- never applies transitively, so the fixtures module's use of
# hadris_udf::write needs this instead.
test-fixtures = ["dep:hadris-udf"]

[dev-dependencies]
tempfile = "3"
# Only for building synthetic UDF fixtures in tests -- argos-core itself
# never writes a UDF filesystem.
hadris-udf = { version = "2.2.0", features = ["write"] }
