[package]
name = "argos-core"
description = "Platform-agnostic domain logic for Argos: device model, ISO classification, checksums, write engine, progress/cancellation. No direct OS disk I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
# `newtua-cdfs` under the local name `cdfs`: same ISO9660/ECMA-119 reading API
# as the canonical `cdfs` crate, but without its hard dependency on `fuser`
# (FUSE bindings) and a `clap`-based mount binary that argos-core never uses.
# See docs/architecture.md's phase-2 guiding decisions for why the fork was
# chosen over the canonical crate.
cdfs = { package = "newtua-cdfs", version = "0.2.4-newtua.1" }
# Real Windows installer media is a UDF bridge, not plain ISO9660 --
# confirmed against a real Windows 10 22H2 ISO during W1's own validation.
# Pure Rust, `read`+`std`+`sync` only (default features; `write` is a
# dev-only feature, used just to build synthetic UDF test fixtures). See
# docs/architecture.md's phase-2 guiding decisions and this crate's
# rust-version bump (1.75 -> 1.88, hadris-udf's MSRV) for why.
hadris-udf = "2.2.0"

[features]
# Exposes image::windows::fixtures outside this crate's own tests, so
# argos-privileged's root-gated Windows-write integration tests (backlog
# #27, W3) can build a real Windows-installer-shaped ISO without
# duplicating that hand-rolled ISO9660/UDF builders. Never enabled in a
# production build -- only ever turned on as a dev-dependency feature.
#
# Forwards to hadris-udf's own `write` feature: when a downstream crate
# (argos-privileged) depends on this crate normally (not via
# [dev-dependencies]) with test-fixtures on, this crate's own
# [dev-dependencies] section -- where hadris-udf/write is otherwise enabled,
# for this crate's own `cargo test` -- never applies transitively, so the
# fixtures module's use of hadris_udf::write needs this forwarding instead.
test-fixtures = ["hadris-udf/write"]

[dev-dependencies]
tempfile = "3"
# Only for building synthetic UDF fixtures in tests -- argos-core itself
# never writes a UDF filesystem.
hadris-udf = { version = "2.2.0", features = ["write"] }
