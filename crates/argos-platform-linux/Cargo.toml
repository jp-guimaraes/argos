[package]
name = "argos-platform-linux"
description = "Linux backend for PlatformOps: disk enumeration via sysfs + the udev database, mount/system-disk detection via /proc/mounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Enables ARGOS_TEST_FORCE_REMOVABLE, an env-var escape hatch that makes a
# specific device look like a removable USB disk regardless of what sysfs/udev
# actually report. Exists only so the loop-device integration tests (backlog
# E9) can exercise the real write path against a throwaway file-backed device
# without real USB hardware. Never enabled in a production build -- it is not
# a default feature, and nothing in this crate turns it on except a test.
test-overrides = []

[dependencies]
argos-core = { workspace = true }
argos-platform = { workspace = true }
# Not target-gated to Linux even though this crate only makes sense there:
# it's a workspace member, so `cargo test --workspace`/clippy compile it on
# every host regardless of what other crates pull it in for. zbus itself
# compiles fine cross-platform (there's just no udisksd to talk to at
# runtime anywhere but Linux).
zbus = "5"

# Only where it is used: `unmount_path` calls `umount2(2)` directly (M7.1,
# backlog #46). Target-gated so the other hosts this crate still compiles on
# -- it is a workspace member, see the note above -- do not pull it in.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"
# Used by tests/dm_resolution.rs to create a throwaway loop-device backing
# file -- not a runtime dependency of the crate itself.
tempfile = "3"
