[package]
name = "argos-platform"
description = "The PlatformOps contract every OS backend (argos-platform-linux, -macos, -windows) implements. Contains no implementation itself."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Exposes `fake::FakePlatform` outside this crate, so orchestration tests in
# argos-session (and later a GUI) can drive the write flow without hardware.
# Mirrors argos-core's `test-fixtures` feature, and for the same reason: a
# [dev-dependencies] feature does not apply transitively, so a downstream
# crate that needs the fixture has to be able to turn it on as a normal one.
# Never enabled in a production build.
#
# Scope limit, deliberately: this is for testing *orchestration* -- does
# prepare_write run its checks in the right order, does a front end cope with
# a device vanishing mid-selection. It is NOT for testing device safety. A
# fake that declares a disk safe proves nothing about the code that decides
# that; those tests stay against real enumeration signals and real devices.
test-fixtures = []

[dependencies]
argos-core = { workspace = true }
