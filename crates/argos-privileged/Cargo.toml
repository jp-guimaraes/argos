[package]
name = "argos-privileged"
description = "argos-helper: the minimal, privilege-separated binary that does the actual disk write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "argos-helper"
path = "src/main.rs"

[features]
# Passes through to argos-platform-linux's escape hatch for the loop-device
# integration tests (backlog E9). Never enabled in a production build.
test-overrides = ["argos-platform-linux/test-overrides"]

[dependencies]
argos-core = { workspace = true }
argos-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
argos-platform-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
argos-platform-macos = { workspace = true }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
