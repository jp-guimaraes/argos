[package]
name = "argos-privileged"
description = "argos-helper: the minimal, privilege-separated binary that does the actual disk write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "argos-helper"
path = "src/main.rs"

[features]
# Passes through to argos-platform-linux's and argos-platform-macos's escape
# hatch (both named ARGOS_TEST_FORCE_REMOVABLE) for the loop-device and
# hdiutil-image integration tests (backlog E9). Each reference is a no-op on
# the other target, since the corresponding platform crate isn't part of the
# dependency graph there. Never enabled in a production build.
test-overrides = [
    "argos-platform-linux/test-overrides",
    "argos-platform-macos/test-overrides",
]

[dependencies]
argos-core = { workspace = true }
argos-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
argos-platform-linux = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
argos-platform-macos = { workspace = true }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
